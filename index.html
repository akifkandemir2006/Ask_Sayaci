<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İlk Mesajdan Beri...</title>
    <!-- Google Fontleri -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px 20px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
        }

        p.subtitle {
            font-size: 1rem;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.22);
            padding: 12px 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .time-box span {
            display: block;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .time-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            opacity: 0.9;
        }

        .footer-note {
            margin-top: 15px;
            font-size: 0.85rem;
            font-style: italic;
            opacity: 0.95;
        }

        /* iPhone küçük ekranlar için ekstra güvence */
        @media (max-width: 380px) {
            h1 {
                font-size: 2.5rem;
            }
            .time-box span {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Her şeyin başlangıcı</h1>
        <p class="subtitle">İlk mesajı attığın andan itibaren geçen zaman...</p>
        
        <div class="counter-grid">
            <div class="time-box">
                <span id="days">0</span>
                <label>Gün</label>
            </div>
            <div class="time-box">
                <span id="hours">0</span>
                <label>Saat</label>
            </div>
            <div class="time-box">
                <span id="minutes">0</span>
                <label>Dakika</label>
            </div>
            <div class="time-box">
                <span id="seconds">0</span>
                <label>Saniye</label>
            </div>
        </div>

        <div class="footer-note" id="startDateText"></div>
    </div>

    <script>
        // iPhone Safari uyumlu tarih tanımlaması (Yıl, Ay (0-11 arası), Gün, Saat, Dakika, Saniye)
        // 5 Nisan 2026, 21:42 -> Nisan ayı 3'üncü aydır (Ocak=0, Şubat=1, Mart=2, Nisan=3)
        const startDate = new Date(2026, 3, 5, 21, 42, 0); 

        // Milat bilgisini ekrana yazdır
        document.getElementById("startDateText").innerText = 
            `Milat: ${startDate.toLocaleDateString('tr-TR')} saat ${startDate.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'})}`;

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.querySelector('.subtitle').innerText = "Bu tarihten geleceğe geri sayıyoruz!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        // Sayacı hemen başlat ve her saniye güncelle
        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
</html>
